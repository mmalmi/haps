[package]
name = "haps"
version = "0.1.23"
edition = "2024"
description = "Hashtree Package System: signed packages, content-addressed distribution, social discovery"
license = "MIT"
homepage = "https://haps.hashtree.cc"
repository = "https://github.com/mmalmi/haps"
readme = "README.md"
keywords = ["hashtree", "nostr", "packages", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*.rs", "/src/desktop/*.ps1", "/src/integrations/*.py", "/tests/**/*.rs", "/tests/*.py", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/PUBLISHING.md", "/LICENSE", "/haps.toml", "/haps-build.toml", "/scripts/sync-legacy-recipe.py", "/haps-release.json", "/scripts/bundle.py", "/scripts/build-inputs.py", "/scripts/build-inputs.json", "/scripts/verify-public-source.py", "/scripts/hashtree-bundle.json", "/scripts/hashtree-LICENSE", "/packages/catalog-root.json", "/website/public/install.sh"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
futures = "0.3"
hashtree-core = "=0.2.91"
hashtree-config = "=0.2.83"
hashtree-fs = "=0.2.83"
hashtree-index = "=0.2.85"
hashtree-client = "=0.1.5"
hashtree-nostr = "=0.2.90"
hashtree-nostr-pubsub = "=0.2.87"
hex = "0.4"
ignore = "0.4"
nostr = "=0.44.8"
nostr-pubsub = "=0.1.18"
nostr-pubsub-relay = "=0.1.13"
nostr-social-graph = "=0.1.4"
nostr-identity = "=0.5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
dialoguer = { version = "0.12", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tiny_http = "0.12"
axum = { version = "0.7", features = ["ws"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
