name: Check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: macos-latest
            runner: macos-14
          - os: windows-latest
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install hash-pinned Rust toolchain
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/build-inputs.py rust --work "$RUNNER_TEMP/build-inputs" --bash "$BASH"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Install Linux build isolation
        if: runner.os == 'Linux'
        run: |
          python3 scripts/build-inputs.py ubuntu-test-tools --work "$RUNNER_TEMP/build-inputs"
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            # Load Ubuntu's scoped bwrap profile; retain the host-wide restriction.
            if [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              sudo install -m 644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
                /etc/apparmor.d/bwrap-userns-restrict
            fi
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          # Fail before compiling if this runner cannot provide build isolation.
          /usr/bin/bwrap --unshare-all --unshare-user --die-with-parent \
            --disable-userns --cap-drop ALL --ro-bind / / -- /bin/true
      - name: Install the supported Omarchy picker
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 https://github.com/junegunn/fzf/releases/download/v0.74.5/fzf-0.74.5-linux_amd64.tar.gz -o "$RUNNER_TEMP/fzf.tar.gz"
          echo 'd47d7f882972c7d674dbbba998ffa4116e68379616ffac7695d0671e9a722c5f  '"$RUNNER_TEMP/fzf.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/fzf"
          tar -xzf "$RUNNER_TEMP/fzf.tar.gz" -C "$RUNNER_TEMP/fzf" fzf
          sudo install -m 755 "$RUNNER_TEMP/fzf/fzf" /usr/local/bin/fzf
          /usr/local/bin/fzf --version
      - name: Test the Omarchy picker
        if: runner.os == 'Linux'
        env:
          HAPS_TEST_FZF: /usr/local/bin/fzf
        run: python3 -m unittest discover -s tests -p omarchy_test.py
      - name: Check all targets with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native installation and package lifecycle
        run: cargo test --locked
      - name: Test installers and audit integration
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import pathlib, sys, unittest
          sys.path.insert(0, 'tests')
          modules = [path.stem for path in sorted(pathlib.Path('tests').glob('*_test.py'))
                     if path.name != 'omarchy_test.py']
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          sys.exit(not unittest.TextTestRunner().run(suite).wasSuccessful())
          PY
      - name: Verify the publishable crate
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo publish --dry-run --locked
      - name: Retain the verified crate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: haps-crate-verified
          path: target/package/**/haps-*.crate
          if-no-files-found: error
          retention-days: 7
      - name: Build and install an audited PKGBUILD using Arch tooling
        if: runner.os == 'Linux'
        run: bash scripts/test-makepkg.sh
      - name: Test the interactive chooser in a macOS terminal
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tests -p chooser_test.py
      - name: Verify macOS build containment
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tests -p build_isolation_test.py
      - name: Build a locked dependency with explicit network access
        if: runner.os == 'Linux' || runner.os == 'macOS'
        env:
          HAPS_LIVE_BUILD_NETWORK: '1'
        run: python3 -m unittest discover -s tests -p build_isolation_test.py -k locked_cargo
      - name: Launch a desktop entry through GIO
        if: runner.os == 'Linux'
        run: HAPS_TEST_DESKTOP=1 cargo test --locked desktop_launcher_tracks_install_update_rollback_and_removal
      - name: Install real published example apps
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 25
        env:
          HAPS_TEST_APPS: iris-chat,iris-drive,nostr-vpn
        run: cargo test --locked --test published_apps -- --ignored --nocapture
      - name: Retain the verified Linux worker binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: haps-linux-verified
          path: target/debug/haps
          retention-days: 7
