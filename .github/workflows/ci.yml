name: Check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check all targets with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native installation and package lifecycle
        run: cargo test --locked
      - name: Test Omarchy integration
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Launch a desktop entry through GIO
        if: runner.os == 'Linux'
        run: HAPS_TEST_DESKTOP=1 cargo test --locked desktop_launcher_tracks_install_update_rollback_and_removal
