name: Verify published Haps Darwin checkpoint
on:
  push:
    branches: [codex/haps-025-publisher-handoff]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      RELEASE_COMMIT: 3bbb4177d244b3be76172419bf9611a74ec53ff9
      RELEASE_RUN: '41843932486'
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - name: Read verification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Check out exact official source and ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: 3bbb4177d244b3be76172419bf9611a74ec53ff9
          fetch-depth: 0
          persist-credentials: false
      - name: Bind freshly downloaded tagged companion bytes
        run: |
          set -eu
          test "$(git rev-parse 'v0.1.25^{commit}')" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor 0f00ad99d97b4be3a5280d50eddd2d2daa96630d "$RELEASE_COMMIT"
          python3 scripts/bundle.py --target aarch64-apple-darwin --destination "$RUNNER_TEMP/companions" --cache "$RUNNER_TEMP/companion-cache"
      - name: Verify complete cold public Hashtree source
        run: |
          python3 scripts/verify-public-source.py --commit "$RELEASE_COMMIT" --helpers "$RUNNER_TEMP/companions/libexec" --read-server https://cdn.iris.to --read-server https://upload.iris.to --clone-timeout 600
      - name: Compare official release, hosted native archive and extracted binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -IB ../harness/qualification/verify-darwin.py --commit "$RELEASE_COMMIT" --release-run "$RELEASE_RUN" --companions "$RUNNER_TEMP/companions/libexec" --output "$RUNNER_TEMP/verified-tools"
      - name: Install the tag’s pinned native Rust compiler
        run: python3 scripts/build-inputs.py rust --target aarch64-apple-darwin --work "$RUNNER_TEMP/build-inputs" --bash "$BASH"
      - name: Run the tagged checkpoint fixture against the delivered Haps
        run: |
          set -eu
          cargo test --locked --test incremental_publish --no-run --message-format=json > "$RUNNER_TEMP/test-build.jsonl"
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          target=Path('target/debug').resolve()
          records=[json.loads(line) for line in (root/'test-build.jsonl').read_text().splitlines()]
          tests=[r['executable'] for r in records if r.get('reason')=='compiler-artifact' and r['target']['name']=='incremental_publish' and r.get('executable')]
          assert len(tests)==1 and Path(tests[0]).parent==target/'deps'
          verified=root/'verified-tools';receipt=json.loads((verified/'qualification.json').read_text())
          expected=receipt['bundle_members_sha256']['haps']
          executable=target/'haps'
          assert executable.is_file() and not executable.is_symlink()
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()
          copy=target/'qualification-published-haps'
          shutil.copy2(verified/'haps',copy); copy.replace(executable)
          assert sha(executable)==expected
          result=subprocess.run([tests[0],'--exact','no_op_and_failed_upload_retry_keep_server_scoped_successful_checkpoints','--nocapture'],
                                text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
          print(result.stdout);result.check_returncode()
          assert '1 passed' in result.stdout and sha(executable)==expected
          evidence={'source':receipt['commit'],'tag':receipt['tag'],'tested_published_haps_sha256':expected,'scope':'isolated loopback catalog and mocked helper','fixture':tests[0].split('/')[-1],'passed':True}
          (verified/'checkpoint-smoke.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PYTHON
      - name: Preserve qualification receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: haps-v0.1.25-iris-publisher-receipts
          path: |
            ${{ runner.temp }}/verified-tools/qualification.json
            ${{ runner.temp }}/verified-tools/checkpoint-smoke.json
          if-no-files-found: error
          retention-days: 14
